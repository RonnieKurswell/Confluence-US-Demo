<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <title>Unlock AI Value — Infosys AI-First Value Framework</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <!-- Starts on the intro; main.js drops the class when Begin is pressed. -->
  <body class="intro-open">
    <canvas id="stage"></canvas>

    <!-- Brand lockup -->
    <header class="lockup" id="lockup">
      <div class="mark">INFOSYS</div>
      <div class="eyebrow" id="eyebrow"></div>
      <div class="event" id="event"></div>
    </header>

    <!-- Overview state -->
    <section class="overview" id="overview">
      <div class="prompt" id="prompt">
        <span class="prompt-ring"></span>
        <span class="prompt-text">Touch a value pool to explore</span>
      </div>
      <h1 class="overview-headline" id="overviewHeadline"></h1>
      <p class="overview-sub" id="overviewSub"></p>
      <div class="facts" id="facts"></div>
    </section>

    <!-- Detail panel -->
    <aside class="panel" id="panel" aria-hidden="true">
      <div class="panel-inner">
        <button class="back" id="close" aria-label="Back to the framework">
          <span class="back-arrow" aria-hidden="true">←</span>
          <span>Back</span>
        </button>
        <div class="verb" id="panelVerb"></div>
        <h1 class="title" id="panelTitle"></h1>
        <p class="hook" id="panelHook"></p>
        <ul class="bullets" id="panelBullets"></ul>
        <div class="panel-media" id="panelMedia"></div>
        <button class="cases-cta" id="casesCta">
          <span class="cases-count" id="casesCount"></span>
          <span id="casesLabel"></span>
          <span class="cases-arrow" aria-hidden="true">→</span>
        </button>
        <p class="proof" id="panelProof"></p>
        <button class="guidebook-cta" id="guidebookCta">
          <span class="cta-icon" aria-hidden="true">⌖</span>
          <span id="ctaLabel"></span>
        </button>
      </div>
      <div class="panel-nav">
        <button class="nav-btn" id="prevBtn" aria-label="Previous value pool">‹</button>
        <div class="dots" id="dots"></div>
        <button class="nav-btn" id="nextBtn" aria-label="Next value pool">›</button>
      </div>
    </aside>

    <!-- Warp transition, played once when Begin is pressed -->
    <div class="warp" id="warp" aria-hidden="true">
      <video id="warpVideo" muted playsinline preload="auto"></video>
      <div class="warp-names" id="warpNames"></div>
    </div>

    <!-- Expanded video / case study -->
    <div class="video-layer" id="videoLayer" role="dialog" aria-modal="true" aria-hidden="true">
      <div class="video-stage" id="videoStage">
        <button class="close video-close" id="videoClose" aria-label="Close">
          <span></span><span></span>
        </button>
        <div class="stage-media">
          <div class="video-frame" id="videoFrame">
            <video id="lightboxVideo" playsinline loop muted></video>
            <img id="lightboxImage" alt="" />
            <div class="video-empty" id="videoEmpty">
              <div class="media-icon">▶</div>
              <div class="media-copy">
                <strong>Video slot</strong>
                <span id="videoEmptyHint"></span>
              </div>
            </div>
          </div>
          <div class="video-caption" id="videoCaption">
            <span class="video-verb" id="videoVerb"></span>
            <span class="video-title" id="videoTitle"></span>
          </div>
        </div>
        <div class="case-body" id="caseBody">
          <span class="case-badge" id="caseBadge">Placeholder content</span>
          <span class="case-client" id="caseClient"></span>
          <h2 class="case-title" id="caseTitle"></h2>
          <dl class="case-facts" id="caseFacts"></dl>
          <div class="case-metric">
            <span class="case-metric-value" id="caseMetricValue"></span>
            <span class="case-metric-label" id="caseMetricLabel"></span>
          </div>
        </div>
      </div>
    </div>

    <!-- Case study gallery -->
    <div class="cases-layer" id="casesLayer" role="dialog" aria-modal="true" aria-hidden="true">
      <button class="close cases-close" id="casesClose" aria-label="Close">
        <span></span><span></span>
      </button>
      <div class="cases-head">
        <span class="cases-verb" id="casesVerb"></span>
        <h2 class="cases-title" id="casesTitle"></h2>
      </div>
      <div class="cases-grid" id="casesGrid"></div>
    </div>

    <!-- QR takeaway -->
    <div class="qr-layer" id="qrLayer" role="dialog" aria-modal="true" aria-hidden="true">
      <div class="qr-card">
        <button class="close qr-close" id="qrClose" aria-label="Close">
          <span></span><span></span>
        </button>
        <div class="qr-code" id="qrCode"></div>
        <h2 class="qr-title" id="qrTitle"></h2>
        <p class="qr-sub" id="qrSub"></p>
        <p class="qr-foot" id="qrFoot"></p>
      </div>
    </div>

    <div class="hint" id="kbdHint">1–6 select · esc back · ← → cycle</div>

    <!-- Intro / homepage. Sits above everything until Begin is pressed. -->
    <section class="intro" id="intro">
      <video id="introVideo" class="intro-video" autoplay muted loop playsinline preload="auto"></video>
      <div class="intro-scrim"></div>
      <div class="intro-content">
        <header class="lockup intro-lockup">
          <div class="mark">INFOSYS</div>
          <div class="eyebrow" id="introEyebrow"></div>
          <div class="event" id="introEvent"></div>
        </header>
        <h1 class="intro-headline" id="introHeadline"></h1>
        <p class="intro-sub" id="introSub"></p>
        <button class="begin" id="begin">
          <span class="begin-label" id="beginLabel"></span>
          <span class="begin-arrow" aria-hidden="true">→</span>
        </button>
      </div>
    </section>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
